version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: ai_etl_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_etl_network

  redis:
    image: redis:7.2-alpine
    container_name: ai_etl_redis
    ports:
      - "6379:6379"
    networks:
      - ai_etl_network

  backend:
    build: ./backend             
    container_name: ai_etl_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app           
    environment:
      - DB_HOST=postgres          
      - DB_PORT=5432
    depends_on:
      - postgres                
    networks:
      - ai_etl_network

volumes:
  postgres_data:

networks:
  ai_etl_network:
    driver: bridge
